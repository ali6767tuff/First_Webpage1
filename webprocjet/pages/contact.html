<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Kontakt</title>
    <link rel="stylesheet" href="../style/style.css">
</head>

<body>

    <header>
        <h1>Kontakt</h1>
        <nav>
            <ul>
                <li class="ett"><a href="../index.html">Hem</a></li>
                <li class="två"><a href="about.html">Om oss</a></li>
                <li class="tre"><a href="contact.html">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Kontakta oss</h2>
        <p>Här hittar du våra kontaktuppgifter.</p>

        <form action="#" method="get">
            <label for="namn">Namn</label>
            <input type="text" id="namn" name="username" required>

            <label for="epost">E-post</label>
            <input type="email" id="epost" name="epost" required>

            <label for="subject">Ärende</label>
            <select id="subject" name="subject">
                <option value="question">Fråga</option>
                <option value="proposal">Förslag</option>
            </select>

            <label for="message">Meddelande</label>
            <textarea id="message" name="message" rows="5"></textarea>

            <button type="submit">Skicka</button>
        </form>
    </main>

    <footer>
        <p>Ali's webbplats 2026 </p>
    </footer>

</body>

</html>
